<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BYKO — Réglages : 3 propositions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Tokens repris de src/renderer/src/styles/tokens.css */
:root {
  --bg: #f4f1ec; --surface: #fff; --text: #1d1d1f; --muted: #736b61;
  --border: rgba(29,29,31,.1); --accent: #0c66e4; --success: #1a7f37; --danger: #c0392b;
  --r-card: 20px; --r-ctl: 12px; --r-pill: 999px;
  --font: "Geist", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --soft: #f4f1ec;
  --scale: 1; --gap: 1; --dur: 1;
}
/* Réglages d'accessibilité appliqués en direct (démo) */
body.a11y-contrast { --text:#000; --muted:#3d3832; --border:rgba(0,0,0,.55); --accent:#0848a8; --soft:#e6e1d8; }
body.a11y-font { --font: "Atkinson Hyperlegible", var(--font); }
body.a11y-motion { --dur: 0; }
body.a11y-focus *:focus-visible { outline: 3px solid #000 !important; outline-offset: 3px !important; box-shadow: 0 0 0 6px #ffd400 !important; }
body.a11y-cb { --success:#0072b2; --danger:#d55e00; }

* { box-sizing: border-box; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); -webkit-font-smoothing: antialiased; min-height: 100vh; }
button { font-family: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ——— Cadre de démo ——— */
.stage-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 14px 24px; background: rgba(244,241,236,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.stage-bar h1 { font-size: 15px; font-weight: 600; margin-right: auto; }
.proposal-switch { display: inline-flex; padding: 3px; background: rgba(29,29,31,.07); border-radius: var(--r-pill); }
.proposal-switch button { border: 0; background: none; padding: 7px 16px; border-radius: var(--r-pill); font-size: 13px; font-weight: 500; color: var(--muted); }
.proposal-switch button[aria-selected="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.stage { display: grid; place-items: center; padding: 32px 24px 24px; min-height: calc(100vh - 140px); background: rgba(29,29,31,.4) ; background: radial-gradient(circle at 30% 20%, #e9e3d8, #d9d2c5); }
.verdict { max-width: 760px; margin: 0 auto; padding: 20px 24px 48px; font-size: 14px; line-height: 1.55; color: var(--muted); }
.verdict strong { color: var(--text); }
.verdict ul { padding-left: 18px; margin-top: 6px; }

/* ——— Modale (commun) ——— */
.modal { background: var(--surface); border-radius: var(--r-card); box-shadow: 0 24px 64px rgba(29,29,31,.25); overflow: hidden; display: flex; flex-direction: column; font-size: calc(14px * var(--scale)); width: 100%; height: min(640px, 78vh); }
.modal-title { font-size: 1.7em; font-weight: 600; letter-spacing: -.01em; }
.close { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--soft); font-size: 16px; display: grid; place-items: center; flex-shrink: 0; }
.panel { overflow-y: auto; flex: 1; min-height: 0; }
.panel-inner { animation: fade calc(.25s * var(--dur)) ease; padding-bottom: 16px; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.label { padding: calc(20px * var(--gap)) 24px 8px; font-size: .85em; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.row { display: flex; align-items: center; gap: 12px; padding: calc(10px * var(--gap)) 24px; }
.row .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex-shrink: 0; }
.row .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .name { font-weight: 600; }
.row .sub { color: var(--muted); font-size: .93em; line-height: 1.4; }
.row.clickable:hover { background: var(--soft); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
.link { background: none; border: 0; color: var(--accent); font-size: .93em; padding: 0; }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r-pill); padding: 6px 14px; font-size: .93em; font-weight: 500; }
.btn:hover { background: var(--soft); }
.btn.primary { background: var(--text); color: #fff; border-color: var(--text); }
.note { margin: 4px 24px 0; padding: 12px 14px; border-radius: var(--r-ctl); background: var(--soft); color: var(--muted); font-size: .93em; line-height: 1.5; }
.note b { color: var(--text); }

/* Interrupteur */
.switch { position: relative; width: 42px; height: 24px; border-radius: 12px; border: 0; background: rgba(29,29,31,.2); flex-shrink: 0; transition: background calc(.2s * var(--dur)); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform calc(.2s * var(--dur)); }
.switch[aria-checked="true"] { background: var(--success); }
.switch[aria-checked="true"]::after { transform: translateX(18px); }
.switch:disabled { opacity: .4; cursor: not-allowed; }

/* Segmenté */
.seg { display: flex; padding: 3px; background: var(--soft); border-radius: var(--r-ctl); margin: 4px 24px 0; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 8px; border-radius: 9px; font-size: .93em; font-weight: 500; color: var(--muted); display: flex; flex-direction: column; gap: 2px; align-items: center; }
.seg button small { font-size: .8em; font-weight: 400; opacity: .85; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Curseur */
.range-row { padding: calc(12px * var(--gap)) 24px; }
.range-head { display: flex; justify-content: space-between; margin-bottom: 8px; }
.range-head output { color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--text); }
.scale-marks { display: flex; justify-content: space-between; color: var(--muted); font-size: .8em; margin-top: 2px; }

/* Jauge de tokens */
.meter { margin: 4px 24px 0; padding: 14px; border: 1px solid var(--border); border-radius: var(--r-ctl); }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; }
.meter-top b { font-size: 1.5em; font-variant-numeric: tabular-nums; }
.bar { height: 8px; border-radius: 4px; background: var(--soft); margin-top: 10px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--text); border-radius: 4px; transition: width calc(.3s * var(--dur)); }
.meter small { display: block; margin-top: 8px; color: var(--muted); }

/* Aperçu accessibilité */
.preview { margin: 4px 24px 0; padding: 14px; border: 1px dashed var(--border); border-radius: var(--r-ctl); line-height: calc(1.45 * var(--gap)); }
.preview b { display: block; margin-bottom: 4px; }

/* ═════ A — Barre latérale ═════ */
.A { max-width: 780px; }
.A .body { display: flex; flex: 1; min-height: 0; }
.A .side { width: 210px; background: var(--soft); padding: 20px 12px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
.A .side .modal-title { padding: 0 12px 14px; font-size: 1.4em; }
.A .nav { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; background: none; border-radius: 10px; font-size: 1em; font-weight: 500; color: var(--muted); text-align: left; width: 100%; }
.A .nav svg { width: 18px; height: 18px; flex-shrink: 0; }
.A .nav:hover { background: rgba(29,29,31,.06); }
.A .nav[aria-current="page"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.A .nav .badge { margin-left: auto; font-size: .8em; background: rgba(29,29,31,.1); border-radius: var(--r-pill); padding: 1px 7px; }
.A .side .foot { margin-top: auto; padding: 12px; color: var(--muted); font-size: .85em; }
.A .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.A .main-head { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px 0; }
.A .main-head h2 { font-size: 1.3em; font-weight: 600; }

/* ═════ B — Onglets ═════ */
.B { max-width: 580px; }
.B .head { display: flex; justify-content: space-between; align-items: center; padding: 24px 24px 0; }
.B .tabs { position: relative; display: flex; gap: 4px; padding: 16px 24px 0; border-bottom: 1px solid var(--border); margin-top: 0; }
.B .tab { border: 0; background: none; padding: 10px 14px 12px; font-size: 1em; font-weight: 500; color: var(--muted); display: flex; align-items: center; gap: 7px; position: relative; }
.B .tab svg { width: 16px; height: 16px; }
.B .tab:hover { color: var(--text); }
.B .tab[aria-selected="true"] { color: var(--text); }
.B .tab-ind { position: absolute; bottom: -1px; height: 2px; background: var(--text); border-radius: 2px; transition: left calc(.25s * var(--dur)) ease, width calc(.25s * var(--dur)) ease; }

/* ═════ C — Accueil + détail ═════ */
.C { max-width: 580px; position: relative; }
.C .head { display: flex; justify-content: space-between; align-items: center; padding: 24px 24px 0; gap: 12px; }
.C .head .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.C .back { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--soft); display: grid; place-items: center; font-size: 15px; }
.C .cards { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 12px; animation: fade calc(.25s * var(--dur)) ease; }
.C .card { display: flex; align-items: center; gap: 16px; padding: 18px; border: 1px solid var(--border); border-radius: var(--r-card); background: var(--surface); text-align: left; width: 100%; transition: transform calc(.15s * var(--dur)), box-shadow calc(.15s * var(--dur)); }
.C .card:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(29,29,31,.08); }
.C .card .big { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--soft); flex-shrink: 0; }
.C .card .big svg { width: 24px; height: 24px; }
.C .card .info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.C .card .name { font-weight: 600; font-size: 1.1em; }
.C .card .sub { color: var(--muted); font-size: .93em; line-height: 1.4; }
.C .card .chev { color: var(--muted); font-size: 1.3em; }
.C .pill { display: inline-flex; align-items: center; gap: 6px; font-size: .85em; color: var(--muted); }
.C .detail { display: flex; flex-direction: column; flex: 1; min-height: 0; animation: slide calc(.28s * var(--dur)) ease; }
@keyframes slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

.hidden { display: none !important; }
@media (max-width: 720px) { .A .side { width: 64px; } .A .nav span, .A .side .modal-title, .A .side .foot, .A .nav .badge { display: none; } .A .nav { justify-content: center; } }
</style>
</head>
<body>

<div class="stage-bar">
  <h1>BYKO · Réglages — prototype de navigation</h1>
  <div class="proposal-switch" role="tablist" aria-label="Proposition">
    <button role="tab" data-p="A" aria-selected="true">A · Barre latérale</button>
    <button role="tab" data-p="B" aria-selected="false">B · Onglets</button>
    <button role="tab" data-p="C" aria-selected="false">C · Accueil + détail</button>
  </div>
</div>

<main class="stage" id="stage"></main>
<section class="verdict" id="verdict"></section>

<script>
/* ——— Icônes ——— */
const IC = {
  plug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0V8zM12 18v4"/></svg>',
  spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3zM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16z"/></svg>',
  access: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="1.8"/><path d="M5 8.5l7 1.5 7-1.5M12 10v5m0 0l-3 6m3-6l3 6"/></svg>'
};
const SECTIONS = [
  { id: 'connectors', label: 'Connecteurs', icon: IC.plug },
  { id: 'ai', label: 'Intelligence artificielle', short: 'IA', icon: IC.spark },
  { id: 'access', label: 'Accessibilité', icon: IC.access }
];

/* ——— État ——— */
const S = {
  proposal: 'A', section: 'connectors',
  aiMode: 'balanced',
  ai: { suggest: true, summary: true, pilot: true, voice: true },
  a: { scale: 1, contrast: false, font: false, motion: false, spacing: 1, focus: false, cb: false, sounds: true, captions: true, keys: true, hints: true }
};
const AIFEATS = [
  ['suggest', 'Suggestions pendant la frappe', 'BCC devine la suite dans « Parler à BCC ». Appelle l’IA à chaque pause.', 3],
  ['summary', 'Comptes rendus de réunion', 'Résumé et actions extraits de la transcription.', 5],
  ['pilot', 'Pilotage des connecteurs', 'L’IA aide à configurer Jira, Agenda, Figma.', 2],
  ['voice', 'Compréhension de la voix', 'Reformulation des mémos vocaux transcrits.', 4]
];
const MODES = [['full', 'Complet', 'Tout activé'], ['balanced', 'Économe', 'Sur demande'], ['off', 'Désactivé', 'Aucun appel']];

/* ——— Briques ——— */
const sw = (key, on, extra = '') => `<button class="switch" role="switch" aria-checked="${on}" data-sw="${key}" ${extra} aria-label="${key}"></button>`;
const row = (ico, color, name, sub, right) => `<div class="row"><div class="ico" style="background:${color}">${ico}</div><div class="info"><span class="name">${name}</span><span class="sub">${sub}</span></div>${right}</div>`;

function connectors() {
  const on = [['J', '#0052CC', 'Jira', 'paul@byko.fr · byko.atlassian.net'], ['G', '#4285F4', 'Google Agenda', 'Client OAuth personnel'], ['F', '#A259FF', 'Figma', 'Jeton personnel']];
  const off = [['S', '#611F69', 'Slack', 'Fils de discussion et notifications'], ['T', '#5B5FC7', 'Microsoft Teams', 'Réunions et messages'], ['O', '#0364B8', 'Outlook', 'Agenda et e-mails'], ['G', '#1E1E1E', 'GitHub', 'Pull requests liées aux tickets']];
  return `<div class="panel-inner"><p class="label">Connecté</p>` +
    on.map(c => row(c[0], c[1], c[2], c[3], `<span class="dot"></span><button class="link">Gérer</button>`)).join('') +
    `<p class="label">Ajouter une source</p>` +
    off.map(c => row(c[0], c[1], c[2], c[3], `<button class="btn">Connecter</button>`)).join('') + `</div>`;
}

function aiTokens() {
  if (S.aiMode === 'off') return 0;
  const base = AIFEATS.reduce((n, f) => n + (S.ai[f[0]] ? f[3] : 0), 0);
  return Math.round(base * (S.aiMode === 'balanced' ? 0.4 : 1) * 10) / 10;
}
function ai() {
  const off = S.aiMode === 'off';
  const t = aiTokens(), max = 14;
  return `<div class="panel-inner">
    <p class="label">Mode d’utilisation</p>
    <div class="seg" role="radiogroup" aria-label="Mode IA">${MODES.map(m => `<button role="radio" aria-checked="${S.aiMode === m[0]}" data-mode="${m[0]}">${m[1]}<small>${m[2]}</small></button>`).join('')}</div>
    <p class="label">Consommation estimée</p>
    <div class="meter"><div class="meter-top"><b>${off ? '0' : '~' + t + ' k'}</b><span class="sub">tokens / jour</span></div>
      <div class="bar"><i style="width:${Math.min(100, t / max * 100)}%"></i></div>
      <small>${off ? 'Aucune donnée n’est envoyée à un fournisseur d’IA.' : S.aiMode === 'balanced' ? 'En mode Économe, l’IA ne tourne que lorsque vous la sollicitez.' : 'En mode Complet, BCC anticipe et appelle l’IA automatiquement.'}</small></div>
    <p class="label">Fonctions</p>
    ${AIFEATS.map(f => `<div class="row"><div class="info"><span class="name">${f[1]}</span><span class="sub">${f[2]}</span></div>${sw('ai.' + f[0], off ? false : S.ai[f[0]], off ? 'disabled' : '')}</div>`).join('')}
    <div class="note"><b>Sans IA, BYKO reste utilisable :</b> agenda, journal, connecteurs et prise de notes manuelle fonctionnent normalement.</div></div>`;
}

function access() {
  const a = S.a;
  const toggle = (k, n, s) => `<div class="row"><div class="info"><span class="name">${n}</span><span class="sub">${s}</span></div>${sw('a.' + k, a[k])}</div>`;
  return `<div class="panel-inner">
    <p class="label">Lecture</p>
    <div class="range-row"><div class="range-head"><label for="r-scale" class="name">Taille du texte</label><output>${Math.round(a.scale * 100)} %</output></div>
      <input id="r-scale" type="range" min="0.85" max="1.4" step="0.05" value="${a.scale}" data-range="scale"><div class="scale-marks"><span>A</span><span style="font-size:1.25em">A</span></div></div>
    <div class="range-row"><div class="range-head"><label for="r-gap" class="name">Espacement</label><output>${a.spacing === 1 ? 'Normal' : a.spacing < 1 ? 'Compact' : 'Aéré'}</output></div>
      <input id="r-gap" type="range" min="0.8" max="1.4" step="0.2" value="${a.spacing}" data-range="spacing"></div>
    ${toggle('font', 'Police facilitant la lecture', 'Atkinson Hyperlegible, conçue pour la basse vision.')}
    <div class="preview"><b>Aperçu</b>Réunion de cadrage à 10 h — 3 tickets Jira à relire avant le point d’équipe.</div>
    <p class="label">Couleurs et contraste</p>
    ${toggle('contrast', 'Contraste élevé', 'Textes plus foncés, bordures renforcées.')}
    ${toggle('cb', 'Palette adaptée au daltonisme', 'Remplace vert/rouge par bleu/orange.')}
    <p class="label">Mouvement et focus</p>
    ${toggle('motion', 'Réduire les animations', 'Supprime transitions et effets de goutte d’eau.')}
    ${toggle('focus', 'Focus renforcé', 'Contour épais et très visible au clavier.')}
    <p class="label">Son et clavier</p>
    ${toggle('sounds', 'Sons d’interface', 'Retours sonores discrets lors des actions.')}
    ${toggle('captions', 'Sous-titres des réponses vocales', 'Affiche le texte pendant que BCC parle.')}
    ${toggle('keys', 'Navigation clavier complète', 'Tab, flèches et raccourcis dans « Parler à BCC ».')}
    <div class="row"><button class="btn" data-reset>Rétablir les valeurs par défaut</button></div></div>`;
}
const RENDER = { connectors, ai, access };
const summary = {
  connectors: () => '3 connectés · 4 disponibles',
  ai: () => S.aiMode === 'off' ? 'Désactivée — aucun token consommé' : (S.aiMode === 'balanced' ? 'Mode Économe' : 'Mode Complet') + ' · ~' + aiTokens() + ' k tokens/jour',
  access: () => { const n = ['contrast', 'font', 'motion', 'focus', 'cb'].filter(k => S.a[k]).length + (S.a.scale !== 1 ? 1 : 0); return n ? n + ' personnalisation' + (n > 1 ? 's' : '') + ' active' + (n > 1 ? 's' : '') : 'Valeurs par défaut'; }
};
const sec = id => SECTIONS.find(s => s.id === id);

/* ——— Gabarits des 3 propositions ——— */
const SHELL = {
  A: () => `<div class="modal A" role="dialog" aria-label="Réglages"><div class="body">
    <nav class="side" aria-label="Sections"><h2 class="modal-title">Réglages</h2>
      ${SECTIONS.map(s => `<button class="nav" data-go="${s.id}" ${S.section === s.id ? 'aria-current="page"' : ''}>${s.icon}<span>${s.short || s.label}</span>${s.id === 'connectors' ? '<em class="badge" style="font-style:normal">3</em>' : ''}</button>`).join('')}
      <div class="foot">BYKO 0.9 · Les réglages s’appliquent immédiatement.</div></nav>
    <div class="main"><div class="main-head"><h2>${sec(S.section).label}</h2><button class="close" aria-label="Fermer">✕</button></div>
      <div class="panel" id="panel">${RENDER[S.section]()}</div></div></div></div>`,

  B: () => `<div class="modal B" role="dialog" aria-label="Réglages">
    <div class="head"><h2 class="modal-title">Réglages</h2><button class="close" aria-label="Fermer">✕</button></div>
    <div class="tabs" role="tablist">${SECTIONS.map(s => `<button class="tab" role="tab" data-go="${s.id}" aria-selected="${S.section === s.id}">${s.icon}${s.short || s.label}</button>`).join('')}<span class="tab-ind" id="ind"></span></div>
    <div class="panel" id="panel">${RENDER[S.section]()}</div></div>`,

  C: () => S.section === 'home' || !S.section ? `<div class="modal C" role="dialog" aria-label="Réglages">
      <div class="head"><h2 class="modal-title">Réglages</h2><button class="close" aria-label="Fermer">✕</button></div>
      <div class="panel"><div class="cards">${SECTIONS.map(s => `<button class="card" data-go="${s.id}"><span class="big">${s.icon}</span><span class="info"><span class="name">${s.label}</span><span class="sub" data-sum="${s.id}">${summary[s.id]()}</span></span><span class="chev">›</span></button>`).join('')}</div></div></div>`
    : `<div class="modal C" role="dialog" aria-label="Réglages"><div class="detail">
      <div class="head"><div class="left"><button class="back" data-go="home" aria-label="Retour aux réglages">‹</button><h2 class="modal-title" style="font-size:1.4em">${sec(S.section).label}</h2></div><button class="close" aria-label="Fermer">✕</button></div>
      <div class="panel" id="panel">${RENDER[S.section]()}</div></div></div>`
};
const VERDICT = {
  A: `<strong>A · Barre latérale</strong> — le modèle « Réglages système » (macOS, Slack, Notion).<ul><li>Les 3 sections sont toujours visibles, un clic suffit : idéal si la liste grandit (Notifications, Compte…).</li><li>Modale plus large (780 px) ; sur petite fenêtre la barre se réduit aux icônes.</li></ul>`,
  B: `<strong>B · Onglets</strong> — le plus proche de la modale actuelle (580 px, même en-tête).<ul><li>Changement minimal côté code : on garde le contenu existant et on ajoute une barre d’onglets.</li><li>Limite : au-delà de 4–5 sections, les onglets deviennent à l’étroit.</li></ul>`,
  C: `<strong>C · Accueil + détail</strong> — une page d’accueil de cartes résumées, puis un écran par section avec bouton retour.<ul><li>Chaque carte montre l’état en un coup d’œil (« IA désactivée », « 3 connectés »).</li><li>Plus lisible pour un public non technique, mais un clic de plus pour passer d’une section à l’autre.</li></ul>`
};

/* ——— Rendu ——— */
function applyA11y() {
  const a = S.a, b = document.body.classList;
  b.toggle('a11y-contrast', a.contrast); b.toggle('a11y-font', a.font); b.toggle('a11y-motion', a.motion);
  b.toggle('a11y-focus', a.focus); b.toggle('a11y-cb', a.cb);
  document.documentElement.style.setProperty('--scale', a.scale);
  document.documentElement.style.setProperty('--gap', a.spacing);
}
function render(keepScroll) {
  const st = document.getElementById('stage'), old = document.getElementById('panel'), y = old ? old.scrollTop : 0;
  st.innerHTML = SHELL[S.proposal]();
  document.getElementById('verdict').innerHTML = VERDICT[S.proposal];
  document.querySelectorAll('.proposal-switch button').forEach(b => b.setAttribute('aria-selected', b.dataset.p === S.proposal));
  const p = document.getElementById('panel'); if (p && keepScroll) { p.scrollTop = y; p.querySelector('.panel-inner').style.animation = 'none'; }
  moveIndicator();
}
function moveIndicator() {
  const ind = document.getElementById('ind'); if (!ind) return;
  const t = document.querySelector('.tab[aria-selected="true"]'); if (!t) return;
  ind.style.left = t.offsetLeft + 'px'; ind.style.width = t.offsetWidth + 'px';
}

/* ——— Événements ——— */
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.p) { S.proposal = t.dataset.p; S.section = t.dataset.p === 'C' ? 'home' : (S.section === 'home' ? 'connectors' : S.section); applyA11y(); return render(); }
  if (t.dataset.go) { S.section = t.dataset.go; return render(); }
  if (t.dataset.mode) { S.aiMode = t.dataset.mode; return render(true); }
  if (t.dataset.reset !== undefined) { Object.assign(S.a, { scale: 1, contrast: false, font: false, motion: false, spacing: 1, focus: false, cb: false }); applyA11y(); return render(true); }
  if (t.dataset.sw) {
    const [g, k] = t.dataset.sw.split('.'); S[g === 'ai' ? 'ai' : 'a'][k] = !S[g === 'ai' ? 'ai' : 'a'][k];
    applyA11y(); return render(true);
  }
});
document.addEventListener('input', e => {
  const r = e.target.dataset.range; if (!r) return;
  S.a[r] = parseFloat(e.target.value); applyA11y();
  const out = e.target.closest('.range-row').querySelector('output');
  out.textContent = r === 'scale' ? Math.round(S.a.scale * 100) + ' %' : (S.a.spacing === 1 ? 'Normal' : S.a.spacing < 1 ? 'Compact' : 'Aéré');
});
window.addEventListener('resize', moveIndicator);
document.addEventListener('keydown', e => {
  const tab = e.target.closest && e.target.closest('.tab');
  if (tab && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    const i = SECTIONS.findIndex(s => s.id === S.section), n = (i + (e.key === 'ArrowRight' ? 1 : SECTIONS.length - 1)) % SECTIONS.length;
    S.section = SECTIONS[n].id; render(); document.querySelector('.tab[aria-selected="true"]').focus();
  }
});
document.fonts && document.fonts.ready.then(moveIndicator);
render();
</script>
